<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ягодная лавка</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>

  <body id="top">
    <!-- Шапка -->
    <!-- Логотип -->
    <header class="site-header">
      <div class="site-header__inner">
        <a
          class="logo"
          href="#top"
          aria-label="Ягодная лавка - перейти на главную"
        >
          <span class="logo__icon" aria-hidden="true">🍓</span>
          <span class="logo__text">Ягодная<br />лавка</span>
        </a>
        <!-- Форма поиска -->
        <form class="search" id="search-form" role="search">
          <label class="visually-hidden" for="search-input">
            Поиск товаров
          </label>
          <span class="search__icon" aria-hidden="true">⌕</span>
          <input
            class="search__input"
            id="search-input"
            name="search"
            type="search"
            placeholder="Найти варенье"
            autocomplete="off"
          />
        </form>
        <!-- Адрес доставки -->
        <div class="delivery-info">
          <span class="delivery-info__icon" aria-hidden="true">⌖</span>
          <span>
            <strong>Укажите адрес доставки</strong>
            <small>доставим от 45 минут</small>
          </span>
        </div>
        <!-- Номер для связи -->
        <a class="phone" href="tel:+78888888888">8 (888) 888-88-88</a>

        <button
          class="cart-button"
          id="open-cart-button"
          type="button"
          aria-label="Открыть корзину"
        >
          <span class="cart-button__icon" aria-hidden="true">🧺</span>
          <span class="cart-button__text">
            <strong id="header-cart-total">0 ₽</strong>
            <small><span id="header-cart-count">0</span>шт.</small>
          </span>
        </button>
      </div>
    </header>

    <div class="page" id="top">
      <!-- Боковое меню каталога -->
      <aside class="sidebar" aria-label="Разделы Ягодной лавки">
        <p class="sidebar__city">
          <span class="sidebar__city-icon" aria-hidden="true">📍</span>
          Санкт-Петербург
        </p>

        <nav class="sidebar__nav" aria-label="Категории товаров">
          <h2 class="sidebar__title">Каталог</h2> 

          <button class="sidebar__link is-active" type="button" data-category="Все">Все товары</button>
          <button class="sidebar__link" type="button" data-category="Варенье">Варенье</button>
          <button class="sidebar__link" type="button" data-category="Джемы и конфитюры">Джемы и конфитюры</button>
          <button class="sidebar__link" type="button" data-category="Мармелад и пастила">Мармелад и пастила</button>
          <button class="sidebar__link" type="button" data-category="Сиропы и напитки">Сиропы и напитки</button>
          <button class="sidebar__link" type="button" data-category="Соусы и чатни">Соусы и чатни</button>
          <button class="sidebar__link" type="button" data-category="Фркутовые снеки">Фруктовые снеки</button>
          <button class="sidebar__link" type="button" data-category="Подарочные наборы">Подарочные наборы</button>
          <button class="sidebar__link" type="button" data-category="Необычные вкусы">Необычные вкусы</button>
        </nav>
        <div class="sidebar__note">
          <span aria-hidden="true">🍓</span>
          <p>
            <strong>Из сада прямо к вам</strong><br />Бережно упакуем и доставим от 45 минут
          </p>
        </div>
    </aside>

    <!-- Основное содержимое страницы -->
    <main class="content">
      <!-- главный баннер с меняющимися вкусами -->
       <section class="flavor-hero" id="hero" aria-labelledby="hero-title">
        <!-- весь текст -->
          <div class="flavor-hero__content">
            <p class="flavor-hero__type" id="hero-type">
              Варенье
            </p>
            <h1 class="flavor-hero__title" id="hero-title">
              Малиновое
            </h1>
            <p class="flavor-hero__description" id="hero-description">
              Густое варенье из спелой малины с лёгкой ягодной кислинкой
            </p>
            <p class="flavor-hero__price" id="hero-price">
              390 ₽
            </p>
            <a class="flavor-hero__button" id="hero-button" href="#catalog">
              Смотреть в каталоге
            </a>
          </div>

          <!-- Банка и названия вкусов -->
          <div class="flavor-hero__visual"> 
            
          </div>
       </section>

    </main>
  </body>
</html>
